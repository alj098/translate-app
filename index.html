<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>中译英</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    }
    .header { text-align: center; padding: 24px 0 16px; }
    .header h1 { font-size: 22px; color: #1a1a1a; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .header .icon { font-size: 28px; }
    .card { background: #fff; border-radius: 20px; padding: 20px; margin-bottom: 16px; box-shadow: 0 2px 12px rgba(0,0,0,0.06); }
    .label { font-size: 13px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; margin-bottom: 10px; display: flex; align-items: center; justify-content: space-between; }
    .label .clear-btn { font-size: 12px; color: #1a73e8; background: none; border: none; font-weight: 500; }
    textarea { width: 100%; min-height: 120px; border: 1.5px solid #e8eaed; border-radius: 14px; padding: 14px; font-size: 17px; line-height: 1.6; resize: none; outline: none; font-family: inherit; transition: border-color 0.2s; -webkit-appearance: none; }
    textarea:focus { border-color: #1a73e8; }
    .output-box { width: 100%; min-height: 120px; background: #f8f9fa; border: 1.5px solid #e8eaed; border-radius: 14px; padding: 14px; font-size: 17px; line-height: 1.6; color: #1a1a1a; word-break: break-word; }
    .output-box:empty::before { content: "翻译结果..."; color: #bbb; }
    .arrow { display: flex; justify-content: center; margin: 8px 0; color: #bbb; font-size: 20px; }
    .btn-primary { width: 100%; padding: 16px; background: #1a73e8; color: #fff; border: none; border-radius: 14px; font-size: 17px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px; -webkit-appearance: none; }
    .btn-primary:active { transform: scale(0.97); background: #1557b0; }
    .btn-primary:disabled { background: #ccc; }
    .copy-bar { display: flex; justify-content: flex-end; margin-top: 8px; }
    .copy-btn { font-size: 13px; color: #1a73e8; background: rgba(26,115,232,0.08); border: none; padding: 6px 14px; border-radius: 20px; font-weight: 600; cursor: pointer; }
    .copy-btn.copied { color: #34a853; background: rgba(52,168,83,0.08); }
    .status { text-align: center; font-size: 12px; color: #888; margin-top: 12px; min-height: 18px; }
    .status.error { color: #c5221f; }
    .status.success { color: #34a853; }
    .fallback-box { margin-top: 12px; padding: 12px; background: #fff3e0; border-radius: 10px; font-size: 13px; color: #e65100; display: none; }
    .fallback-box a { color: #1a73e8; text-decoration: none; font-weight: 600; }
    @media (min-width: 600px) { body { max-width: 480px; margin: 0 auto; } }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="icon">🌐</span> 中译英</h1>
  </div>

  <div class="card">
    <div class="label">
      <span>中文输入</span>
      <button class="clear-btn" onclick="clearAll()">清空</button>
    </div>
    <textarea id="input" placeholder="输入中文..."></textarea>
  </div>

  <div class="arrow">↓</div>

  <div class="card">
    <div class="label">英文输出</div>
    <div class="output-box" id="output"></div>
    <div class="copy-bar">
      <button class="copy-btn" id="copyBtn" onclick="copyResult()">复制结果</button>
    </div>
    <div class="fallback-box" id="fallback">
      在线翻译接口暂时不可用，建议：<br>
      1. 检查网络连接<br>
      2. 尝试 <a href="https://fanyi.baidu.com" target="_blank">百度翻译</a> 或 <a href="https://fanyi.youdao.com" target="_blank">有道翻译</a>
    </div>
  </div>

  <button class="btn-primary" id="transBtn" onclick="translate()">翻译</button>
  <div class="status" id="status"></div>

  <script>
    const input = document.getElementById('input');
    const output = document.getElementById('output');
    const btn = document.getElementById('transBtn');
    const copyBtn = document.getElementById('copyBtn');
    const status = document.getElementById('status');
    const fallback = document.getElementById('fallback');

    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = 'status ' + (type || '');
    }

    function clearAll() {
      input.value = '';
      output.textContent = '';
      setStatus('');
      fallback.style.display = 'none';
      input.focus();
    }

    // 备用API列表，按优先级尝试
    async function tryTranslate(text) {
      // API 1: MyMemory（免费，有速率限制）
      try {
        const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=zh|en`;
        const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
        const data = await res.json();
        if (data.responseStatus === 200) {
          return { text: data.responseData.translatedText, source: 'MyMemory' };
        }
      } catch (e) { console.log('MyMemory failed', e); }

      // API 2: Google Translate 非官方（国内大概率不可用，作为备用）
      try {
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=zh-CN&tl=en&dt=t&q=${encodeURIComponent(text)}`;
        const res = await fetch(url, { signal: AbortSignal.timeout(8000) });
        const data = await res.json();
        const result = data[0].map(item => item[0]).join('');
        return { text: result, source: 'Google' };
      } catch (e) { console.log('Google failed', e); }

      // API 3: LibreTranslate 公共实例（部分国内可访问）
      try {
        const url = 'https://libretranslate.de/translate';
        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ q: text, source: 'zh', target: 'en', format: 'text' }),
          signal: AbortSignal.timeout(8000)
        });
        const data = await res.json();
        if (data.translatedText) {
          return { text: data.translatedText, source: 'LibreTranslate' };
        }
      } catch (e) { console.log('LibreTranslate failed', e); }

      throw new Error('所有翻译接口均不可用');
    }

    async function translate() {
      const text = input.value.trim();
      if (!text) { setStatus('请输入内容', 'error'); return; }

      btn.disabled = true;
      btn.textContent = '翻译中...';
      setStatus('');
      fallback.style.display = 'none';

      try {
        const result = await tryTranslate(text);
        output.textContent = result.text;
        setStatus(`翻译完成 (${result.source})`, 'success');
      } catch (err) {
        output.textContent = '';
        setStatus('翻译失败：网络或接口受限', 'error');
        fallback.style.display = 'block';
      }

      btn.disabled = false;
      btn.textContent = '翻译';
    }

    async function copyResult() {
      const text = output.textContent;
      if (!text) return;
      try {
        await navigator.clipboard.writeText(text);
        copyBtn.textContent = '已复制';
        copyBtn.classList.add('copied');
        setTimeout(() => { copyBtn.textContent = '复制结果'; copyBtn.classList.remove('copied'); }, 1500);
      } catch (e) { setStatus('复制失败', 'error'); }
    }

    // 支持回车翻译（手机键盘上的"前往"/"搜索"键）
    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        translate();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
