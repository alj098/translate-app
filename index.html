<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a73e8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>中译英</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    }
    .header { text-align: center; padding: 20px 0 12px; }
    .header h1 { font-size: 20px; color: #1a1a1a; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .header .icon { font-size: 26px; }
    .card { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
    .label { font-size: 12px; color: #888; font-weight: 600; text-transform: uppercase; letter-spacing: 0.6px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; }
    .label .clear-btn { font-size: 12px; color: #1a73e8; background: none; border: none; font-weight: 500; }
    textarea { width: 100%; min-height: 80px; border: 1.5px solid #e8eaed; border-radius: 12px; padding: 12px; font-size: 16px; line-height: 1.5; resize: none; outline: none; font-family: inherit; transition: border-color 0.2s; -webkit-appearance: none; }
    textarea:focus { border-color: #1a73e8; }
    .btn-primary { width: 100%; padding: 14px; background: #1a73e8; color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; -webkit-appearance: none; }
    .btn-primary:active { transform: scale(0.97); background: #1557b0; }
    .btn-secondary { width: 100%; padding: 12px; background: #fff; color: #1a73e8; border: 1.5px solid #1a73e8; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 8px; -webkit-appearance: none; }
    .iframe-wrap { width: 100%; height: 0; overflow: hidden; border-radius: 12px; background: #fff; transition: height 0.3s; }
    .iframe-wrap.active { height: 360px; border: 1px solid #e8eaed; }
    iframe { width: 100%; height: 100%; border: none; }
    .status { text-align: center; font-size: 12px; color: #888; margin-top: 8px; min-height: 18px; }
    .status.error { color: #c5221f; }
    .status.success { color: #34a853; }
    .tips { font-size: 12px; color: #999; text-align: center; margin-top: 6px; line-height: 1.5; }
    @media (min-width: 600px) { body { max-width: 480px; margin: 0 auto; } }
  </style>
</head>
<body>
  <div class="header">
    <h1><span class="icon">🌐</span> 中译英</h1>
  </div>

  <div class="card">
    <div class="label">
      <span>中文输入</span>
      <button class="clear-btn" onclick="clearAll()">清空</button>
    </div>
    <textarea id="input" placeholder="输入中文..."></textarea>
  </div>

  <button class="btn-primary" id="transBtn" onclick="doTranslate()">翻译</button>
  
  <div class="iframe-wrap" id="iframeWrap">
    <iframe id="fanyiFrame" sandbox="allow-scripts allow-same-origin allow-forms"></iframe>
  </div>
  
  <button class="btn-secondary" id="openBtn" style="display:none;" onclick="openInNew()">在新页面打开翻译</button>
  
  <div class="status" id="status"></div>
  <div class="tips">翻译由百度翻译提供，结果可直接在下方框中复制</div>

  <script>
    const input = document.getElementById('input');
    const iframeWrap = document.getElementById('iframeWrap');
    const fanyiFrame = document.getElementById('fanyiFrame');
    const transBtn = document.getElementById('transBtn');
    const openBtn = document.getElementById('openBtn');
    const status = document.getElementById('status');
    let currentText = '';

    function setStatus(msg, type) {
      status.textContent = msg;
      status.className = 'status ' + (type || '');
    }

    function clearAll() {
      input.value = '';
      iframeWrap.classList.remove('active');
      fanyiFrame.src = '';
      openBtn.style.display = 'none';
      setStatus('');
      input.focus();
    }

    function doTranslate() {
      const text = input.value.trim();
      if (!text) { setStatus('请输入内容', 'error'); return; }
      
      currentText = text;
      transBtn.textContent = '加载中...';
      setStatus('');
      
      const url = 'https://fanyi.baidu.com/#zh/en/' + encodeURIComponent(text);
      
      fanyiFrame.src = url;
      iframeWrap.classList.add('active');
      openBtn.style.display = 'block';
      
      setTimeout(() => {
        transBtn.textContent = '翻译';
        setStatus('翻译已加载，请在下方框中查看结果', 'success');
      }, 1500);
    }

    function openInNew() {
      if (currentText) {
        window.open('https://fanyi.baidu.com/#zh/en/' + encodeURIComponent(currentText), '_blank');
      }
    }

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        doTranslate();
      }
    });

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
